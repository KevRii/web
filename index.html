<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的 AI 客户端</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: Arial, "Microsoft YaHei", sans-serif;
  color: #20252b;
  background: #fff;
}
button, input, textarea { font: inherit; }
button {
  border: 1px solid #d2d9df;
  background: #fff;
  color: #26323a;
  border-radius: 6px;
  padding: 10px 12px;
  cursor: pointer;
}
button:disabled { opacity: .45; cursor: default; }
button:focus, input:focus, textarea:focus {
  outline: 2px solid #188576;
  outline-offset: 1px;
}
.primary { background: #167365; color: white; border-color: #167365; }
.danger { color: #b52d39; }
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
}
header {
  flex-shrink: 0;
  min-height: 58px;
  border-bottom: 1px solid #e0e5e8;
  display: flex;
  align-items: center;
  padding: 8px 10px;
}
header strong { flex: 1; font-size: 18px; }
header button { margin-left: 6px; padding: 8px 10px; }
#messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 18px 14px;
}
#messageInner { max-width: 820px; margin: auto; }
.message { margin-bottom: 24px; }
.role { font-size: 12px; color: #697781; margin-bottom: 7px; }
.content {
  white-space: pre-wrap;
  word-wrap: break-word;
  overflow-wrap: break-word;
  line-height: 1.7;
}
.message img {
  display: block;
  max-width: 100%;
  max-height: 360px;
  margin: 8px 0;
  border-radius: 6px;
}
.reasonToggle {
  color: #58717a;
  font-size: 13px;
  padding: 6px 9px;
  margin-bottom: 8px;
}
.reasonText {
  color: #62747d;
  border-left: 2px solid #cbd8db;
  padding-left: 12px;
  margin-bottom: 12px;
  font-size: 14px;
}
.error { color: #b52d39; font-size: 13px; margin-top: 8px; }
.messageTools { margin-top: 8px; }
.messageTools button { font-size: 12px; padding: 5px 9px; }
.empty { color: #7b8790; text-align: center; margin-top: 50px; }
footer {
  flex-shrink: 0;
  border-top: 1px solid #e0e5e8;
  background: white;
  padding: 10px 12px;
}
.footerInner { max-width: 820px; margin: auto; }
.composer { display: flex; align-items: flex-end; }
.composer button { flex-shrink: 0; margin-left: 7px; }
#attach { margin-left: 0; margin-right: 7px; }
#text {
  flex: 1;
  min-width: 0;
  height: 72px;
  max-height: 150px;
  resize: vertical;
  border: 1px solid #cbd4db;
  border-radius: 6px;
  padding: 10px;
}
#status {
  min-height: 22px;
  font-size: 12px;
  color: #64737e;
  padding-top: 7px;
  word-wrap: break-word;
}
#previews { display: flex; overflow-x: auto; }
.preview { position: relative; margin: 0 8px 8px 0; flex-shrink: 0; }
.preview img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; }
.preview button {
  position: absolute; top: 0; right: 0;
  width: 24px; height: 24px; padding: 0;
}
.overlay {
  display: none;
  position: fixed;
  top: 0; right: 0; bottom: 0; left: 0;
  background: rgba(0,0,0,.45);
  z-index: 20;
  padding: 20px 12px;
  overflow-y: auto;
}
.panel {
  background: #fff;
  max-width: 520px;
  margin: 10px auto;
  padding: 20px;
  border-radius: 8px;
}
.panel h2 { font-size: 20px; margin: 0 0 16px; }
.panel label { display: block; font-size: 13px; margin: 14px 0 6px; }
.panel input, .panel textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #cbd4db;
  border-radius: 6px;
}
.panel textarea { min-height: 100px; }
.note { font-size: 12px; color: #687883; line-height: 1.6; }
.actions { display: flex; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.actions button { margin: 4px 0 0 8px; }
.sessionRow { display: flex; margin: 9px 0; }
.sessionRow .openSession {
  flex: 1; min-width: 0; text-align: left;
  word-wrap: break-word;
}
.sessionRow .deleteSession { margin-left: 7px; }
#bootError {
  display: none; background: #fff0f0; color: #a12430;
  padding: 12px; font-size: 13px; word-wrap: break-word;
}
@media (max-width: 380px) {
  header button { padding: 8px; margin-left: 4px; }
  .composer button { padding: 10px 8px; margin-left: 5px; }
  header strong { font-size: 16px; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <strong>我的 AI</strong>
    <button id="historyButton" type="button">会话</button>
    <button id="newButton" type="button">新建</button>
    <button id="settingsButton" type="button">设置</button>
  </header>
  <div id="bootError"></div>
  <div id="messages">
    <div id="messageInner">
      <div class="empty">正在加载…</div>
    </div>
  </div>
  <footer>
    <div class="footerInner">
      <div id="previews"></div>
      <div class="composer">
        <button id="attach" type="button"
                title="添加图片" aria-label="添加图片">＋</button>
        <textarea id="text" placeholder="输入消息…" aria-label="消息"></textarea>
        <button id="send" type="button" class="primary">发送</button>
        <button id="stop" type="button" style="display:none">停止</button>
      </div>
      <div id="status" role="status"></div>
    </div>
  </footer>
</div>

<input id="files" type="file" accept="image/*" multiple style="display:none">

<div id="settingsOverlay" class="overlay">
  <div class="panel" role="dialog" aria-modal="true" aria-label="接口设置">
    <h2>接口设置</h2>
    <label for="base">API 地址</label>
    <input id="base" type="text"
           placeholder="https://你的服务商/v1">
    <label for="key">API 密钥</label>
    <input id="key" type="password" autocomplete="off" placeholder="sk-…">
    <label for="model">模型 ID</label>
    <input id="model" type="text" placeholder="填写服务商支持的模型名称">
    <label for="prompt">固定提示词</label>
    <textarea id="prompt"
      placeholder="分析英语试卷图片，逐题给出答案和解题依据。"></textarea>
    <p class="note">
      地址可填写到 /v1，也可填写完整的 /chat/completions 地址。
      密钥保存在本机浏览器，不会进入聊天导出文件。
      当前仅支持 OpenAI 兼容聊天接口。
    </p>
    <div id="configStatus" class="note"></div>
    <div class="actions">
      <button id="closeSettings" type="button">取消</button>
      <button id="saveSettings" type="button" class="primary">保存</button>
    </div>
  </div>
</div>

<div id="historyOverlay" class="overlay">
  <div class="panel" role="dialog" aria-modal="true" aria-label="聊天记录">
    <h2>聊天记录</h2>
    <div id="sessionList"></div>
    <p class="note">记录保存在当前浏览器。清除网站数据会删除记录。</p>
    <div class="actions">
      <button id="importButton" type="button">导入</button>
      <button id="exportButton" type="button">导出</button>
      <button id="closeHistory" type="button">关闭</button>
    </div>
  </div>
</div>

<input id="importFile" type="file" accept=".json,application/json"
       style="display:none">

<script>
(function () {
  "use strict";

  function $(id) { return document.getElementById(id); }
  function say(text) { $("status").textContent = text; }
  function show(id) { $(id).style.display = "block"; }
  function hide(id) { $(id).style.display = "none"; }
  function makeId() {
    return "c" + Date.now().toString(36) +
      Math.random().toString(36).slice(2);
  }

  var configKey = "mobile-ai-config-v2";
  var stateKey = "mobile-ai-chats-v2";
  var cfg = { base: "", key: "", model: "", prompt: "" };
  var state = { current: "", chats: [] };
  var pending = [];
  var busy = false;
  var uploading = false;
  var activeRequest = null;
  var database = null;
  var saveChain = Promise.resolve();
  var ready = false;
  var expanded = {};

  window.addEventListener("error", function (event) {
    $("bootError").style.display = "block";
    $("bootError").textContent =
      "页面错误：" + (event.message || "未知错误");
  });

  function current() {
    for (var i = 0; i < state.chats.length; i++) {
      if (state.chats[i].id === state.current) return state.chats[i];
    }
    return null;
  }

  function storeSnapshot(snapshot) {
    if (!database) {
      return new Promise(function (resolve, reject) {
        try {
          localStorage.setItem(stateKey, JSON.stringify(snapshot));
          resolve();
        } catch (error) { reject(error); }
      });
    }
    return new Promise(function (resolve, reject) {
      var tx = database.transaction(["data"], "readwrite");
      tx.objectStore("data").put(snapshot, "state");
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
      tx.onabort = function () { reject(tx.error); };
    });
  }

  function save() {
    var snapshot = JSON.parse(JSON.stringify(state));
    saveChain = saveChain.catch(function () {}).then(function () {
      return storeSnapshot(snapshot);
    });
    return saveChain;
  }

  function saveQuietly() {
    save().catch(function () {
      say("本地保存失败，请导出备份并检查存储空间。");
    });
  }

  function openStorage() {
    return new Promise(function (resolve) {
      if (!window.indexedDB) { resolve(); return; }
      try {
        var request = indexedDB.open("mobile-ai-store-v2", 1);
        request.onupgradeneeded = function () {
          request.result.createObjectStore("data");
        };
        request.onsuccess = function () {
          database = request.result;
          resolve();
        };
        request.onerror = function () { resolve(); };
        request.onblocked = function () {
          say("数据库被其他页面占用，请关闭其他客户端标签页。");
        };
      } catch (error) { resolve(); }
    });
  }

  function loadState() {
    if (!database) {
      return Promise.resolve(
        JSON.parse(localStorage.getItem(stateKey) || "null")
      );
    }
    return new Promise(function (resolve, reject) {
      var tx = database.transaction(["data"], "readonly");
      var request = tx.objectStore("data").get("state");
      request.onsuccess = function () { resolve(request.result); };
      request.onerror = function () { reject(request.error); };
    });
  }

  function updateControls() {
    var locked = busy || uploading || !ready;
    $("send").disabled = locked;
    $("newButton").disabled = locked;
    $("historyButton").disabled = locked;
    $("attach").disabled = locked;
    $("settingsButton").disabled = busy || uploading;
    $("stop").style.display = busy ? "block" : "none";
    $("send").style.display = busy ? "none" : "block";
    renderPreviews();
  }

  function copyText(text) {
    var area = document.createElement("textarea");
    area.value = text;
    area.style.position = "fixed";
    area.style.top = "0";
    area.style.left = "-9999px";
    document.body.appendChild(area);
    area.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (error) {}
    document.body.removeChild(area);
    say(ok ? "已复制" : "复制失败，请长按文字复制。");
  }

  function render() {
    var outer = $("messages");
    var nearBottom =
      outer.scrollHeight - outer.scrollTop - outer.clientHeight < 100;
    var root = $("messageInner");
    root.innerHTML = "";
    var chat = current();

    if (!chat || !chat.messages.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "新对话";
      root.appendChild(empty);
      return;
    }

    chat.messages.forEach(function (message, index) {
      var block = document.createElement("section");
      block.className = "message";
      var role = document.createElement("div");
      role.className = "role";
      role.textContent = message.role === "user" ? "你" : "AI";
      block.appendChild(role);

      (message.images || []).forEach(function (src) {
        var img = document.createElement("img");
        img.src = src;
        img.alt = "对话图片";
        block.appendChild(img);
      });

      if (message.reasoning) {
        var toggle = document.createElement("button");
        var reason = document.createElement("div");
        var reasonId = chat.id + "-" + index;
        toggle.type = "button";
        toggle.className = "reasonToggle";
        reason.className = "reasonText content";
        reason.textContent = message.reasoning;

        function applyExpanded() {
          var opened = !!expanded[reasonId];
          toggle.textContent = opened ? "收起思考 ▴" : "展开思考 ▾";
          toggle.setAttribute("aria-expanded", String(opened));
          reason.style.display = opened ? "block" : "none";
        }
        toggle.onclick = function () {
          expanded[reasonId] = !expanded[reasonId];
          applyExpanded();
        };
        applyExpanded();
        block.appendChild(toggle);
        block.appendChild(reason);
      }

      var content = document.createElement("div");
      content.className = "content";
      content.textContent = message.text || "";
      block.appendChild(content);

      if (message.error) {
        var error = document.createElement("div");
        error.className = "error content";
        error.textContent = message.error;
        block.appendChild(error);
      }

      if (message.text) {
        var tools = document.createElement("div");
        var copy = document.createElement("button");
        tools.className = "messageTools";
        copy.type = "button";
        copy.textContent = "复制";
        copy.onclick = function () { copyText(message.text); };
        tools.appendChild(copy);
        block.appendChild(tools);
      }
      root.appendChild(block);
    });
    if (nearBottom) outer.scrollTop = outer.scrollHeight;
  }

  function renderPreviews() {
    var root = $("previews");
    root.innerHTML = "";
    pending.forEach(function (src, index) {
      var wrap = document.createElement("div");
      var img = document.createElement("img");
      var remove = document.createElement("button");
      wrap.className = "preview";
      img.src = src;
      img.alt = "待发送图片";
      remove.type = "button";
      remove.textContent = "×";
      remove.title = "移除图片";
      remove.disabled = busy || uploading;
      remove.onclick = function () {
        pending.splice(index, 1);
        renderPreviews();
      };
      wrap.appendChild(img);
      wrap.appendChild(remove);
      root.appendChild(wrap);
    });
  }

  function createChat() {
    if (busy || uploading) return;
    var chat = {
      id: makeId(),
      title: "新对话",
      prompt: cfg.prompt || "",
      messages: []
    };
    state.chats.unshift(chat);
    state.current = chat.id;
    pending = [];
    $("text").value = "";
    render();
    renderPreviews();
    saveQuietly();
    say("已新建对话");
  }

  function processImage(file) {
    return new Promise(function (resolve, reject) {
      if (file.size > 20 * 1024 * 1024) {
        reject(new Error("单张图片不能超过 20 MB"));
        return;
      }
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error("图片读取失败")); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () {
          reject(new Error("无法读取此图片，请转换为 JPG 或 PNG。"));
        };
        img.onload = function () {
          try {
            var scale = Math.min(1, 1600 / Math.max(img.width, img.height));
            var canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            var ctx = canvas.getContext("2d");
            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.86));
          } catch (error) { reject(error); }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function apiEndpoint() {
    var base = cfg.base.replace(/^\s+|\s+$/g, "").replace(/\/+$/, "");
    if (!/^https?:\/\/[^\/\s]+/i.test(base)) {
      throw new Error("API 地址必须是完整的 http:// 或 https:// 地址。");
    }
    if (/[?#]/.test(base)) {
      throw new Error("API 地址请不要包含查询参数或 #。");
    }
    if (!/\/chat\/completions$/.test(base)) {
      base += "/chat/completions";
    }
    return base;
  }

  function buildMessages(chat) {
    var result = [];
    if (chat.prompt) {
      result.push({ role: "system", content: chat.prompt });
    }
    chat.messages.forEach(function (m) {
      if (m.role === "assistant" && !m.text) return;
      if (m.images && m.images.length) {
        var content = [{
          type: "text",
          text: m.text || "请按照固定提示词分析图片。"
        }];
        m.images.forEach(function (src) {
          content.push({ type: "image_url", image_url: { url: src } });
        });
        result.push({ role: m.role, content: content });
      } else {
        result.push({ role: m.role, content: m.text || "" });
      }
    });
    return result;
  }

  function startRequest(endpoint, messages, answer) {
    var xhr = new XMLHttpRequest();
    activeRequest = xhr;
    var finished = false;
    var position = 0;
    var lineBuffer = "";
    var eventLines = [];
    var protocolError = null;
    var gotEvent = false;

    function finish(error) {
      if (finished) return;
      finished = true;
      if (error) answer.error = error;
      busy = false;
      activeRequest = null;
      updateControls();
      render();
      say(error || "已完成");
      save().catch(function () {
        say("对话未能保存，请立即导出备份。");
      });
    }

    function dispatchEvent() {
      if (!eventLines.length) return;
      var raw = eventLines.join("\n");
      eventLines = [];
      if (raw === "[DONE]") return;
      var data = JSON.parse(raw);
      if (data.error) {
        throw new Error(data.error.message || "API 返回错误");
      }
      gotEvent = true;
      var delta = data.choices && data.choices[0] &&
        data.choices[0].delta;
      if (!delta) return;
      if (typeof delta.content === "string") answer.text += delta.content;
      if (typeof delta.reasoning_content === "string") {
        answer.reasoning += delta.reasoning_content;
      }
    }

    function feed(final) {
      var full = xhr.responseText || "";
      lineBuffer += full.slice(position);
      position = full.length;
      var index;
      while ((index = lineBuffer.indexOf("\n")) !== -1) {
        var line = lineBuffer.slice(0, index).replace(/\r$/, "");
        lineBuffer = lineBuffer.slice(index + 1);
        if (line === "") dispatchEvent();
        else if (line.indexOf("data:") === 0) {
          eventLines.push(line.slice(5).replace(/^ /, ""));
        }
      }
      if (final) {
        if (lineBuffer.indexOf("data:") === 0) {
          eventLines.push(lineBuffer.slice(5).replace(/^ /, "").replace(/\r$/, ""));
        }
        lineBuffer = "";
        dispatchEvent();
      }
    }

    function isStream() {
      return /text\/event-stream/i.test(
        xhr.getResponseHeader("Content-Type") || ""
      );
    }

    xhr.open("POST", endpoint, true);
    xhr.timeout = 300000;
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.setRequestHeader("Authorization", "Bearer " + cfg.key);

    xhr.onprogress = function () {
      if (finished || xhr.status < 200 || xhr.status >= 300) return;
      if (!isStream()) return;
      try {
        feed(false);
        render();
        say("正在生成…");
      } catch (error) {
        protocolError = "解析回复失败：" + error.message;
        xhr.abort();
      }
    };

    xhr.onload = function () {
      if (finished) return;
      try {
        if (xhr.status < 200 || xhr.status >= 300) {
          throw new Error(
            "HTTP " + xhr.status + "：" +
            (xhr.responseText || "请求失败").slice(0, 900)
          );
        }
        if (isStream()) {
          feed(true);
          if (!gotEvent) throw new Error("接口没有返回可识别的流式数据。");
        } else {
          var data = JSON.parse(xhr.responseText);
          if (data.error) throw new Error(data.error.message || "API 错误");
          var message = data.choices && data.choices[0] &&
            data.choices[0].message;
          if (!message) throw new Error("返回格式不是兼容的聊天接口格式。");
          answer.text = typeof message.content === "string" ?
            message.content : "";
          answer.reasoning = message.reasoning_content || "";
        }
        finish(null);
      } catch (error) { finish(error.message); }
    };

    xhr.onerror = function () {
      finish("连接失败：请检查网络、API 地址和服务商的跨域 CORS 支持。");
    };
    xhr.ontimeout = function () {
      finish("请求超时，已保留收到的回复。");
    };
    xhr.onabort = function () {
      finish(protocolError || "已停止生成");
    };

    try {
      xhr.send(JSON.stringify({
        model: cfg.model,
        messages: messages,
        stream: true
      }));
    } catch (error) { finish(error.message); }
  }

  function send() {
    if (busy || uploading || !ready) return;
    var text = $("text").value.replace(/^\s+|\s+$/g, "");
    if (!text && !pending.length) {
      say("请输入消息或添加图片。");
      return;
    }
    if (!cfg.base || !cfg.key || !cfg.model) {
      openSettings();
      $("configStatus").textContent = "先填写 API 地址、密钥和模型。";
      return;
    }

    var endpoint;
    try { endpoint = apiEndpoint(); }
    catch (error) { say(error.message); return; }

    var chat = current();
    if (!chat) { say("请先新建对话。"); return; }
    if (!chat.messages.length) {
      chat.title = text.slice(0, 26) || "图片分析";
      chat.prompt = cfg.prompt || "";
    }

    chat.messages.push({
      role: "user",
      text: text,
      images: pending.slice()
    });
    var messages = buildMessages(chat);
    var answer = { role: "assistant", text: "", reasoning: "" };
    chat.messages.push(answer);
    pending = [];
    $("text").value = "";
    busy = true;
    updateControls();
    render();
    $("messages").scrollTop = $("messages").scrollHeight;
    say("正在连接…");
    saveQuietly();
    startRequest(endpoint, messages, answer);
  }

  function openSettings() {
    ["base", "key", "model", "prompt"].forEach(function (id) {
      $(id).value = cfg[id] || "";
    });
    $("configStatus").textContent = "";
    show("settingsOverlay");
  }

  function renderSessions() {
    var root = $("sessionList");
    root.innerHTML = "";
    state.chats.forEach(function (chat) {
      var row = document.createElement("div");
      var open = document.createElement("button");
      var remove = document.createElement("button");
      row.className = "sessionRow";
      open.className = "openSession";
      remove.className = "deleteSession danger";
      open.textContent =
        (chat.id === state.current ? "● " : "") + chat.title;
      remove.textContent = "删除";
      open.onclick = function () {
        state.current = chat.id;
        pending = [];
        $("text").value = "";
        render();
        renderPreviews();
        hide("historyOverlay");
        saveQuietly();
        say("已打开对话");
      };
      remove.onclick = function () {
        if (!confirm("确定删除“" + chat.title + "”？")) return;
        state.chats = state.chats.filter(function (item) {
          return item.id !== chat.id;
        });
        if (!state.chats.length) createChat();
        else {
          if (state.current === chat.id) {
            state.current = state.chats[0].id;
            pending = [];
            $("text").value = "";
          }
          render();
          renderPreviews();
          saveQuietly();
        }
        renderSessions();
      };
      row.appendChild(open);
      row.appendChild(remove);
      root.appendChild(row);
    });
  }

  function validChat(chat) {
    if (!chat || typeof chat.title !== "string" ||
        !Array.isArray(chat.messages)) return false;
    return chat.messages.every(function (m) {
      return m && (m.role === "user" || m.role === "assistant") &&
        typeof m.text === "string" &&
        (!m.reasoning || typeof m.reasoning === "string") &&
        (!m.images || (Array.isArray(m.images) &&
          m.images.every(function (src) {
            return typeof src === "string" &&
              /^data:image\/(jpeg|png|webp);base64,/i.test(src);
          })));
    });
  }

  $("settingsButton").onclick = openSettings;
  $("closeSettings").onclick = function () { hide("settingsOverlay"); };
  $("saveSettings").onclick = function () {
    var next = {};
    ["base", "key", "model", "prompt"].forEach(function (id) {
      next[id] = $(id).value.replace(/^\s+|\s+$/g, "");
    });
    try {
      localStorage.setItem(configKey, JSON.stringify(next));
      cfg = next;
      hide("settingsOverlay");
      say("设置和密钥已保存。");
    } catch (error) {
      $("configStatus").textContent =
        "保存失败：请允许网站存储，或退出无痕模式。";
    }
  };

  $("newButton").onclick = createChat;
  $("send").onclick = send;
  $("stop").onclick = function () {
    if (activeRequest) activeRequest.abort();
  };
  $("text").onkeydown = function (event) {
    if (event.keyCode === 13 && (event.ctrlKey || event.metaKey)) {
      event.preventDefault();
      send();
    }
  };
  $("historyButton").onclick = function () {
    renderSessions();
    show("historyOverlay");
  };
  $("closeHistory").onclick = function () { hide("historyOverlay"); };

  $("attach").onclick = function () { $("files").click(); };
  $("files").onchange = function () {
    var files = Array.prototype.slice.call($("files").files || []);
    uploading = true;
    updateControls();
    say("正在处理图片…");

    var chain = Promise.resolve();
    files.forEach(function (file) {
      chain = chain.then(function () {
        if (pending.length >= 4) {
          throw new Error("每条消息最多添加 4 张图片。");
        }
        return processImage(file).then(function (src) {
          pending.push(src);
        });
      });
    });
    chain.then(function () {
      say("图片已添加。");
    }).catch(function (error) {
      say(error.message);
    }).then(function () {
      uploading = false;
      $("files").value = "";
      updateControls();
    });
  };

  $("exportButton").onclick = function () {
    var blob = new Blob([JSON.stringify({
      version: 2,
      chats: state.chats
    }, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = "ai-chats-" + Date.now() + ".json";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
    say("已导出聊天记录，不包含 API 密钥。");
  };

  $("importButton").onclick = function () { $("importFile").click(); };
  $("importFile").onchange = function () {
    var file = $("importFile").files[0];
    if (!file) return;
    if (file.size > 50 * 1024 * 1024) {
      say("备份文件不能超过 50 MB。");
      $("importFile").value = "";
      return;
    }
    var reader = new FileReader();
    reader.onerror = function () { say("读取备份失败。"); };
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!Array.isArray(data.chats) ||
            !data.chats.every(validChat)) {
          throw new Error("不是有效的聊天备份。");
        }
        data.chats.forEach(function (chat) {
          chat.id = makeId();
          chat.prompt = typeof chat.prompt === "string" ? chat.prompt : "";
          state.chats.push(chat);
        });
        saveQuietly();
        renderSessions();
        say("已导入 " + data.chats.length + " 个对话。");
      } catch (error) { say("导入失败：" + error.message); }
    };
    reader.readAsText(file);
    $("importFile").value = "";
  };

  updateControls();
  say("正在加载记录…");
  try {
    var storedConfig = JSON.parse(localStorage.getItem(configKey) || "null");
    if (storedConfig && typeof storedConfig === "object") {
      ["base", "key", "model", "prompt"].forEach(function (field) {
        cfg[field] = typeof storedConfig[field] === "string" ?
          storedConfig[field] : "";
      });
    }
  } catch (error) {
    say("无法读取设置，将使用默认设置。");
  }

  openStorage().then(loadState).then(function (saved) {
    if (saved && Array.isArray(saved.chats) &&
        saved.chats.length && saved.chats.every(validChat)) {
      state = saved;
      if (!current()) state.current = state.chats[0].id;
    }
    ready = true;
    if (!state.chats.length) createChat();
    else render();
    updateControls();
    say(database ? "就绪 · 本机保存已开启" :
      "就绪 · 使用浏览器基础存储，请定期导出备份");
  }).catch(function (error) {
    ready = false;
    updateControls();
    say("本地存储初始化失败：" + error.message);
    $("messageInner").textContent =
      "请检查浏览器的网站存储权限，退出无痕模式后重新打开。";
  });
})();
</script>
</body>
</html>
